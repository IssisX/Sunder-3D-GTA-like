name: Check ChatGPT branch change
on:
  push:
    branches:
      - ChatGPT-version
      - ChatGPT-B
      - ChatGPT-B-integration
      - ChatGPT-B-showcase
permissions:
  contents: read
concurrency:
  group: chatgpt-branch-${{ github.ref }}
  cancel-in-progress: false
jobs:
  change-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: node scripts/run-change-check.mjs
  playable:
    if: contains(github.event.head_commit.message, '[build]')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build:local-preview
      - name: Verify canonical browser bundle
        run: |
          test -s local-preview-dist/index.html
          test -s local-preview-dist/style.css
          test -s local-preview-dist/sunder.js
          test -s local-preview-dist/SUNDER.html
      - uses: actions/upload-artifact@v4
        with:
          name: SUNDER-${{ github.ref_name }}-${{ github.sha }}
          path: local-preview-dist/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/configure-pages@v5
        if: github.ref_name == 'ChatGPT-version'
      - uses: actions/upload-pages-artifact@v4
        if: github.ref_name == 'ChatGPT-version'
        with:
          path: local-preview-dist
  showcase-browser:
    if: contains(github.event.head_commit.message, '[build]') && github.ref_name == 'ChatGPT-B-showcase'
    needs: playable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npx playwright install chromium
      - run: npm run build:local-preview
      - run: node scripts/showcase-browser-check.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SUNDER-showcase-screenshots-${{ github.sha }}
          path: showcase-screenshots/
          if-no-files-found: ignore
          retention-days: 14
  deploy:
    name: Deploy browser preview
    if: contains(github.event.head_commit.message, '[build]') && github.ref_name == 'ChatGPT-version'
    needs: playable
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages-preview
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
