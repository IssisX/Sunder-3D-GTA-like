name: Check ChatGPT-version change

on:
  push:
    branches:
      - ChatGPT-version

permissions:
  contents: read

concurrency:
  group: chatgpt-version-change
  cancel-in-progress: false

jobs:
  change-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout canonical branch state
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install project dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Run one targeted binary check
        run: node scripts/run-change-check.mjs

  playable:
    if: contains(github.event.head_commit.message, '[build]')
    needs: change-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout canonical branch state
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install project dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Build canonical standalone from source
        run: npm run build:local-preview

      - name: Upload canonical standalone
        uses: actions/upload-artifact@v4
        with:
          name: SUNDER-ChatGPT-version-${{ github.sha }}
          path: local-preview-dist/SUNDER.html
          if-no-files-found: error
          retention-days: 14
