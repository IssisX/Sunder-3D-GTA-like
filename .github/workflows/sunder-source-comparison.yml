name: Sunder source comparison
on:
  push:
    branches: [ChatGPT-B-showcase]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Archive competing source trees
        run: |
          mkdir -p /tmp/sunder-sources
          for branch in ChatGPT-B ChatGPT-version Claude Grok Synth main; do
            git archive --format=tar.gz --output="/tmp/sunder-sources/${branch}.tar.gz" "origin/${branch}"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: sunder-competing-sources
          path: /tmp/sunder-sources/*.tar.gz
          retention-days: 1
          if-no-files-found: error
